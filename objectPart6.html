!DOCTYPE <html>
<html lang="en">
    <head>
        <title> if else condition</title>
    </head>
    <h1>create a if  else condition</h1>
    <body>
        <script>
            let user = {
                username: "Sumit",
                age: 20
            };
            if(user.age >= 18){
                console.log("Eligible");
            } else{
                console.log("Not Eligible");
            }
        </script>
    </body>
</html>
